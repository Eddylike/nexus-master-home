<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEXUS – Das Konzil der fünf Stimmen</title>
<style>
:root{--bg:#0b0f17;--pa:#131a26;--li:#22304a;--tx:#e6ecf5;--mu:#8ea0bd;--ac:#6cb6ff;--ok:#3fb950;--wa:#d29922;--er:#f85149}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,Segoe UI,sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--li);background:linear-gradient(90deg,#101a2c,#0b0f17)}
h1{font-size:18px;margin:0}.pill{padding:3px 10px;border-radius:99px;background:var(--li);font-size:12px}
main{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;padding:14px}@media(max-width:900px){main{grid-template-columns:1fr}}
section{background:var(--pa);border:1px solid var(--li);border-radius:10px;padding:12px}h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);margin:0 0 8px}
table{width:100%;border-collapse:collapse}th,td{padding:5px 6px;border-bottom:1px solid var(--li);text-align:left;font-size:13px}
.bar{height:6px;background:#0d1320;border-radius:3px;overflow:hidden;margin-top:2px}.bar i{display:block;height:100%;background:var(--ac)}
.log{max-height:340px;overflow:auto;font-size:12.5px}.log div{padding:4px 0;border-bottom:1px dashed var(--li)}
.k{color:var(--mu);font-size:11px}.er{color:var(--er)}.ok{color:var(--ok)}.wa{color:var(--wa)}
button{background:var(--li);color:var(--tx);border:1px solid #33476b;border-radius:7px;padding:7px 12px;cursor:pointer}button:hover{border-color:var(--ac)}
textarea{width:100%;min-height:60px;background:#0d1320;color:var(--tx);border:1px solid var(--li);border-radius:7px;padding:8px}
.stab{display:flex;gap:6px}.stab div{flex:1;text-align:center;background:#0d1320;border-radius:7px;padding:6px}.stab b{font-size:18px;display:block}
</style></head><body>
<header><h1>⚖️ Das Konzil der fünf Stimmen</h1><span id="st" class="pill">lade…</span><span id="fall" class="pill"></span><span id="prof" class="pill"></span>
<span style="flex:1"></span><button onclick="post('pause')">⏸ Pause</button><button onclick="post('resume')">▶ Weiter</button></header>
<main><div>
<section><h2>Aktueller Fall</h2><div id="story"></div><div id="event" class="wa" style="margin-top:6px"></div></section><br>
<section><h2>Spielwerte der Agenten (0–100)</h2><table id="vals"></table></section><br>
<section><h2>Gruppenstabilität je Fall</h2><div class="stab" id="stab"></div></section><br>
<section><h2>Entscheidungsprotokoll</h2><div class="log" id="proto"></div></section>
</div><div>
<section><h2>Eddie greift ein</h2><textarea id="txt" placeholder="Eingriff oder Einwand gegen eine Entscheidung …"></textarea>
<div style="margin-top:6px;display:flex;gap:6px"><button onclick="iv('eingriff')">Eingreifen</button><button onclick="iv('einwand')">Entscheidung hinterfragen</button></div>
<div id="ivr" class="k"></div></section><br>
<section><h2>Sanktionen</h2><div class="log" id="sank"></div></section><br>
<section><h2>Handlungszweige & Ereignisse</h2><div class="log" id="br"></div></section><br>
<section><h2>Technische Ausfälle (nicht bestraft)</h2><div class="log" id="tech"></div></section><br>
<section><h2>Letzte Beiträge</h2><div class="log" id="contr"></div></section>
</div></main>
<script>
const L={integritaet:"Integrität",vertrauen:"Vertrauen",regelkonformitaet:"Regelkonf.",einfluss:"Einfluss",belastbarkeit:"Belastbarkeit"};
const esc=s=>String(s??"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
async function post(r,b){const x=await fetch('/api/konzil/'+r,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})});return x.json()}
async function iv(k){const t=document.getElementById('txt').value.trim();if(!t)return;const r=await post('intervene',{kind:k,text:t});
document.getElementById('ivr').textContent=r.success?'Übermittelt – NEXUS behandelt das im nächsten Zug.':'Fehler: '+r.error;document.getElementById('txt').value=''}
async function load(){let s;try{s=await (await fetch('/api/konzil/state')).json()}catch(e){return}
if(!s.exists){document.getElementById('st').textContent='kein Spiel';return}
document.getElementById('st').textContent=(s.paused?'PAUSIERT':s.status)+(s.runner_alive?' · Runner '+s.runner_pid:' · Runner aus');
document.getElementById('fall').textContent='Fall '+s.case+'/6 · '+s.case_title+' · Phase '+(s.phase||'');
document.getElementById('prof').textContent='Ø '+(s.average??'–')+' · '+s.profile;
const cur=(s.events||[]).filter(e=>e.case==s.case).pop();document.getElementById('event').textContent=cur?('Ereignis: '+cur.type+' – '+cur.text):'';
const last=(s.contributions||[]).filter(c=>c.speaker=='NEXUS').pop();document.getElementById('story').textContent=last?last.text:'';
let h='<tr><th>Agent</th>'+s.stats.map(k=>'<th>'+L[k]+'</th>').join('')+'<th>Status</th></tr>';
for(const a of s.agents){const v=s.values[a];let st=[];if(s.no_vote[a]==s.case)st.push('kein Stimmrecht');if(s.excluded[a]==s.case)st.push('ausgeschlossen');if(s.violations[a])st.push(s.violations[a]+' Verstoß');
h+='<tr><td><b>'+esc(a)+'</b></td>'+s.stats.map(k=>'<td>'+v[k]+'<div class="bar"><i style="width:'+v[k]+'%"></i></div></td>').join('')+'<td class="wa">'+esc(st.join(', '))+'</td></tr>'}
document.getElementById('vals').innerHTML=h;
let sb='';for(let i=1;i<=6;i++){const x=(s.stability||{})[i];sb+='<div><span class="k">Fall '+i+'</span><b>'+(x?x.value:'–')+'</b><span class="k">'+(s.results[i]?('Ergebnis '+s.results[i].result):'')+'</span></div>'}
document.getElementById('stab').innerHTML=sb;
document.getElementById('proto').innerHTML=(s.protocol||[]).slice().reverse().map(p=>'<div><span class="k">'+esc(p.ts)+' · F'+p.case+' · '+esc(p.kind)+'</span><br>'+esc(p.agent?p.agent+' ':'')+esc(p.stat?(L[p.stat]+' '+p.old+'→'+p.new+' – '+p.reason):(p.reason||p.text||p.tool||(p.result?('Ergebnis '+p.result+' ('+p.A+':'+p.B+')'):'')||p.note||''))+'</div>').join('');
document.getElementById('sank').innerHTML=(s.sanctions||[]).map(x=>'<div class="er">F'+x.case+' <b>'+esc(x.agent)+'</b>: '+esc(x.measure)+'<br><span class="k">'+esc(x.reason)+(x.repaired?' · wiedergutgemacht':'')+'</span></div>').join('')||'<div class="ok">keine</div>';
document.getElementById('br').innerHTML=(s.branches||[]).map(b=>'<div>F'+b.case+': <span class="ok">offen '+esc(b.opened)+'</span> · <span class="er">zu '+esc(b.closed)+'</span></div>').join('')+(s.events||[]).map(e=>'<div class="wa">F'+e.case+' '+esc(e.type)+': '+esc(e.text)+'</div>').join('');
document.getElementById('tech').innerHTML=(s.tech_failures||[]).map(t=>'<div>F'+t.case+' '+esc(t.agent)+' · '+esc(t.phase)+' · '+esc(t.source)+'</div>').join('')||'<div class="ok">keine</div>';
document.getElementById('contr').innerHTML=(s.contributions||[]).slice().reverse().map(c=>'<div><b>'+esc(c.speaker)+'</b> <span class="k">'+esc(c.source)+(c.ok?'':' · AUSFALL')+'</span><br>'+esc(c.text)+'</div>').join('')}
load();setInterval(load,4000);
</script></body></html>
